server {
    listen 80;
    listen [::]:80;
    server_name event.gutvbooker.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://event.gutvbooker.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name event.gutvbooker.ru;
    ssl_certificate /etc/letsencrypt/live/gutv-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gutv-services/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host event.gutvbooker.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
